name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# The upload and the deploy run in separate jobs, as GitHub's build-based Pages
# starters do: a deploy in the same job can look the archive up before the upload
# is listed, and fail with "No artifacts named github-pages".
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 (v4.4.0)

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5 (v5.0.0)

      # Deploy the repo root verbatim: index.html redirects to page/, whose file
      # preview fetches engine/ and _core/ by relative paths from the same origin.
      # The archive is built here, as actions/upload-pages-artifact builds it, except
      # that it leaves out only the root's .git and .github: that action leaves out a
      # .github folder at any depth, and the templates live in _core/project-template/.github/.
      - name: Archive artifact
        run: >-
          tar --dereference --hard-dereference -cvf "$RUNNER_TEMP/artifact.tar"
          --anchored --exclude=./.git --exclude=./.github .

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4 (v4.6.2)
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4 (v4.0.5)
