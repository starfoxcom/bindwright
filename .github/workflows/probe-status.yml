# Throwaway probe: a check run and a commit status of one name. Never merged.
name: Probe status

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  checks: write
  statuses: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post the check and the status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          ACTION: ${{ github.event.action }}
          CHECK_CONCLUSION: success
        run: |
          ID=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=Review%20gate" --jq '[.check_runs[] | .id] | max // empty')
          if [ "$ACTION" = reopened ] && [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/check-runs/$ID" -f status=completed -f conclusion="$CHECK_CONCLUSION" > /dev/null
          else
            gh api -X POST "repos/$REPO/check-runs" -f name="Review gate" -f head_sha="$SHA" -f status=completed -f conclusion="$CHECK_CONCLUSION" > /dev/null
          fi
