name: Tests

# Runs the bind engine tests (JS engine, and the golden test against its Python
# twin) on Linux and Windows, and the Python tests for the guard hooks, receipts
# and the review gate's script. Its check,
# "Engine and hook tests", is required on develop, so pull requests run it
# whatever they change: a path filter would leave the required check
# waiting forever on a PR that touches none of the listed files. Pushes to
# develop run it only when tested files change. No manual trigger.

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
    paths:
      - "engine/**"
      - "_core/**"
      - "tools/**"
      - ".github/scripts/**"
      - ".github/review-gate.yml"
      - ".claude/hooks/**"
      - ".claude/settings.json"
      - "plugin/**"
      - "page/**"
      - ".github/workflows/tests.yml"

permissions:
  contents: read

# A new push to a PR cancels its older run. After a merge to develop each
# commit gets its own group, since a group keeps only one waiting run, so
# every merge commit gets a result.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

# A named bash shell runs with -eo pipefail, so a failing test fails its
# step even when piped through tee. The unnamed default does not set pipefail.
defaults:
  run:
    shell: bash

jobs:
  linux:
    name: Engine and hook tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6 (v6.1.0)
        with:
          persist-credentials: false

      # Runs wherever the engine exists, so hotfixes into main are tested once
      # it ships there. main has none until v2.0.0: the job notes that and
      # passes. develop must always have it.
      - name: Check for the engine
        id: engine
        env:
          BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          if [ -f engine/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = "develop" ]; then
            echo "::error::develop has no engine/package.json"; exit 1
          else
            echo "::notice::No engine on $BRANCH yet, so there is nothing to test."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # The runner's own Node and Python: no setup actions to pin or trust.
      - name: Show tool versions
        if: steps.engine.outputs.present == 'true'
        run: |
          node --version
          python3 --version
          python3 -c "import sys; assert sys.version_info >= (3, 8), sys.version"

      # A skipped test counts as a failure here: the golden test and the hook
      # tests skip themselves when Python is missing, and CI must not pass that way.
      # So does a run with no tests in it.
      - name: Engine tests
        if: steps.engine.outputs.present == 'true'
        run: |
          # Files, not the folder: Node 22 and later read a folder argument as
          # a module path and run nothing. failglob stops the step if no file matches.
          shopt -s failglob
          node --test --test-reporter=tap engine/test/*.test.js | tee node-tests.txt
          grep -qx "# skipped 0" node-tests.txt || { echo "::error::Engine tests were skipped"; exit 1; }
          grep -qE "^# pass [1-9]" node-tests.txt || { echo "::error::No engine tests ran"; exit 1; }

      - name: Guard hook and receipts tests
        if: steps.engine.outputs.present == 'true'
        run: |
          python3 -m unittest -v tools/test_guard_hooks.py tools/test_receipts.py 2>&1 | tee python-tests.txt
          if grep -q "skipped=" python-tests.txt; then echo "::error::Python tests were skipped"; exit 1; fi
          grep -qE "^Ran [1-9][0-9]* tests? in" python-tests.txt || { echo "::error::No Python tests ran"; exit 1; }

      # Not behind the engine check: the review gate's script ships on main
      # first, and every PR's gate runs it.
      - name: Review gate tests
        run: |
          python3 -m unittest -v tools/test_review_gate.py tools/test_pin_check.py 2>&1 | tee gate-tests.txt
          if grep -q "skipped=" gate-tests.txt; then echo "::error::Review gate tests were skipped"; exit 1; fi
          grep -qE "^Ran [1-9][0-9]* tests? in" gate-tests.txt || { echo "::error::No review gate tests ran"; exit 1; }

  # The engine suite again on Windows, where the Python twins take their junction,
  # drive-letter and line-ending paths, which never run on Linux.
  windows:
    name: Engine tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6 (v6.1.0)
        with:
          persist-credentials: false

      - name: Check for the engine
        id: engine
        run: |
          if [ -f engine/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No engine on this branch, so there is nothing to test."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # The Python twins' tests skip without Python, so its absence fails here instead.
      - name: Show tool versions
        if: steps.engine.outputs.present == 'true'
        run: |
          node --version
          python -c "import sys; assert sys.version_info >= (3, 8), sys.version; print(sys.version)"

      # Some tests skip on Windows by design (stop signals do not exist there), so
      # only failures and an empty run fail this step.
      - name: Engine tests
        if: steps.engine.outputs.present == 'true'
        run: |
          shopt -s failglob
          node --test --test-reporter=tap engine/test/*.test.js | tee node-tests.txt
          grep -qx "# fail 0" node-tests.txt || { echo "::error::Engine tests failed"; exit 1; }
          grep -qE "^# pass [1-9]" node-tests.txt || { echo "::error::No engine tests ran"; exit 1; }
          grep -E "^# skipped" node-tests.txt

      # The guard hooks again on Windows: Git Bash, the pipe to Node and junctions take
      # paths there that never run on Linux. Skips are allowed, as above.
      - name: Guard hook tests
        if: steps.engine.outputs.present == 'true'
        run: |
          python -m unittest -v tools/test_guard_hooks.py 2>&1 | tee guard-tests.txt
          grep -qE "^OK" guard-tests.txt || { echo "::error::Guard hook tests failed"; exit 1; }
          grep -qE "^Ran [1-9][0-9]* tests? in" guard-tests.txt || { echo "::error::No guard hook tests ran"; exit 1; }

  # The required check: it passes only when both jobs above pass. A job that
  # needs a failed one would be skipped, and a skipped check counts as passed.
  test:
    name: Engine and hook tests
    needs: [linux, windows]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Both test jobs passed
        env:
          LINUX: ${{ needs.linux.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          echo "Linux: $LINUX, Windows: $WINDOWS"
          [ "$LINUX" = "success" ] && [ "$WINDOWS" = "success" ]
