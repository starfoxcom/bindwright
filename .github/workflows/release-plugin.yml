name: Release plugin

# Publishes a release: first the helper package (`bindwright` on npm and
# PyPI, built from the tag by tools/pack_plugin.py, with provenance and trusted
# publishing, so no token is stored), then the Bindwright plugin zip, attached
# to the release for the marketplace's archive source. The helper goes first
# because the plugin names its exact version. Releases before the helper
# existed have no helper/ folder, and both helper jobs skip them; a version
# already on a registry is skipped too, so a run can be repeated.
#
# The zip is rebuilt from the release tag by tools/pack_plugin.py, which
# reads the files git stores. The job refuses to
# upload a zip whose SHA-256 differs from the one the default branch's
# .claude-plugin/marketplace.json pins, since that copy is the one every
# machine reads, and the marketplace would refuse the zip anyway. The pin may
# land in the release PR or in a hotfix after it: either way the tag can sit
# on the release merge. The same files then go to the `plugin` branch, which
# the plugin directory follows.
#
# When a run refuses, fix the pin on the default branch and run this again
# for the same release, never moving its tag:
#   gh workflow run release-plugin.yml -f tag=vX.Y.Z

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "A published release, such as v2.2.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-plugin
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  check:
    name: Release check
    # By hand, only the default branch's copy of this workflow runs.
    if: github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag such as v2.2.1"
            exit 1
          fi
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) || {
            echo "::error::there is no release $TAG"
            exit 1
          }
          if [ "$draft" != false ]; then
            echo "::error::release $TAG is a draft: publish it first"
            exit 1
          fi

  npm:
    name: Helper on npm
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # Node 24's npm signs in through the trusted publisher set up on npmjs.com.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish the helper
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ ! -d helper ]; then
            echo "::notice::$TAG has no helper package to publish"
            exit 0
          fi
          if npm view "bindwright@$version" version >/dev/null 2>&1; then
            echo "::notice::bindwright $version is already on npm"
            exit 0
          fi
          dir="$RUNNER_TEMP/helper"
          python3 tools/pack_plugin.py --helper-out "$dir" --ref HEAD
          built=$(node -p "require(process.argv[1]).version" "$dir/package.json")
          if [ "$built" != "$version" ]; then
            echo "::error::the helper is version $built, the tag is $TAG"
            exit 1
          fi
          cd "$dir"
          npm publish --provenance --access public
        # Empty once the trusted publisher is set up. npm can set one up only on a
        # package that exists, so the first version publishes with this token,
        # which is deleted afterwards.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  pypi:
    name: Helper on PyPI
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Build the wheel
        id: wheel
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [ ! -d helper ]; then
            echo "::notice::$TAG has no helper package to publish"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/bindwright/$version/json")
          if [ "$code" = 200 ]; then
            echo "::notice::bindwright $version is already on PyPI"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 tools/pack_plugin.py --wheel "$RUNNER_TEMP/wheel" --ref HEAD
          ls "$RUNNER_TEMP/wheel/bindwright-$version-py3-none-any.whl"
          echo "build=true" >> "$GITHUB_OUTPUT"

      # Signs in through the trusted publisher set up on pypi.org, for this workflow and environment.
      - name: Publish the wheel
        if: steps.wheel.outputs.build == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: ${{ runner.temp }}/wheel

  zip:
    name: Plugin zip
    needs: [check, npm, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # Releases before the plugin have no marketplace file: nothing to attach.
      - name: Check for the marketplace file
        id: market
        run: |
          if [ -f .claude-plugin/marketplace.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::This release has no marketplace file, so there is no plugin zip to attach."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the zip and check it against the marketplace file
        if: steps.market.outputs.present == 'true'
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          version="${TAG#v}"
          zip="bindwright-$version.zip"
          market="$RUNNER_TEMP/marketplace.json"
          path="repos/$GITHUB_REPOSITORY/contents/.claude-plugin/marketplace.json?ref=$DEFAULT_BRANCH"
          gh api -H "Accept: application/vnd.github.raw+json" "$path" > "$market"
          python3 tools/pack_plugin.py --zip "$zip" --ref HEAD
          python3 - "$zip" "$version" "$market" "$DEFAULT_BRANCH" <<'EOF'
          import hashlib, json, sys
          zip_path, version, market, branch = sys.argv[1:5]
          with open(market, encoding="utf-8") as fh:
              entry = next(p for p in json.load(fh)["plugins"] if p["name"] == "bindwright")
          with open(zip_path, "rb") as fh:
              built = hashlib.sha256(fh.read()).hexdigest()
          problems = []
          if entry.get("version") != version:
              problems.append("%s's marketplace lists version %s, the tag is %s" % (branch, entry.get("version"), version))
          if entry["source"].get("sha256", "").lower() != built:
              problems.append("%s's marketplace pins %s, the rebuilt zip is %s" % (branch, entry["source"].get("sha256"), built))
          if not entry["source"].get("url", "").endswith("/v%s/bindwright-%s.zip" % (version, version)):
              problems.append("%s's marketplace url does not name this release's zip" % branch)
          for p in problems:
              print("::error::" + p)
          if problems:
              print("::error::pin the zip on %s (python tools/pack_plugin.py --marketplace), then run: "
                    "gh workflow run release-plugin.yml -f tag=v%s" % (branch, version))
          sys.exit(1 if problems else 0)
          EOF
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Attach the zip to the release
        if: steps.market.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: gh release upload "$TAG" "$ZIP" --clobber --repo "$GITHUB_REPOSITORY"

      # The plugin directory listing follows the `plugin` branch, whose root
      # is the packed plugin of the newest release: the same files as the zip,
      # one commit per release on top of the last.
      - name: Publish the packed plugin to the plugin branch
        if: steps.market.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          set -euo pipefail
          zip_path="$GITHUB_WORKSPACE/$ZIP"
          dir="$RUNNER_TEMP/plugin-branch"
          url="https://github.com/$GITHUB_REPOSITORY"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$dir"
          cd "$dir"
          if git -c http.extraheader="$auth" ls-remote --exit-code -q "$url" refs/heads/plugin >/dev/null; then
            git -c http.extraheader="$auth" fetch -q --depth 1 "$url" plugin
            git checkout -q -b plugin FETCH_HEAD
            git rm -rq --ignore-unmatch .
          else
            git checkout -q --orphan plugin
          fi
          unzip -q "$zip_path" -d .
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::The plugin branch already holds $TAG's plugin"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore(release): plugin $TAG"
          git -c http.extraheader="$auth" push -q "$url" plugin:plugin
          echo "::notice::The plugin branch now holds $TAG's plugin"
