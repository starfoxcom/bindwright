name: Release plugin

# Attaches the Bindwright plugin zip to a release, for the marketplace's
# archive source, together with the helper files the plugin's helper.json
# pins by SHA-256: bindwright-X.Y.Z.tgz, which npm installs, and
# bindwright-X.Y.Z-py3-none-any.whl, which pip installs. Releases before the
# helper existed have no helper/ folder, and get the zip alone.
#
# The zip and the helper files are rebuilt from the release tag by
# tools/pack_plugin.py, which reads the files git stores, so the helper files
# match the pins the zip carries. The job refuses to upload a zip whose
# SHA-256 differs from the pin in the starfoxcom/wrights marketplace, the
# only one that lists the plugin, since that marketplace refuses a zip that
# differs from its pin. The release steps bump the pin in a wrights PR before
# the release is published. The same files then go to the `plugin` branch,
# which the plugin directory follows.
#
# When a run refuses, fix the pin in wrights and run this again for the same
# release, never moving its tag:
#   gh workflow run release-plugin.yml -f tag=vX.Y.Z

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "A published release, such as v2.2.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-plugin
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  check:
    name: Release check
    # By hand, only the default branch's copy of this workflow runs.
    if: github.event_name == 'release' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a release tag such as v2.2.1"
            exit 1
          fi
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft) || {
            echo "::error::there is no release $TAG"
            exit 1
          }
          if [ "$draft" != false ]; then
            echo "::error::release $TAG is a draft: publish it first"
            exit 1
          fi

  zip:
    name: Plugin zip
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6 (v6.1.0)
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      # Releases before v2.0.0, the first one a marketplace listed, have no
      # plugin zip to attach.
      - name: Check that the release ships a plugin
        id: market
        run: |
          version="${TAG#v}"
          if [ "${version%%.*}" -ge 2 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$TAG is older than v2.0.0, so there is no plugin zip to attach."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the zip and check it against the marketplace pins
        if: steps.market.outputs.present == 'true'
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          MARKETPLACE_REPO: starfoxcom/wrights
        run: |
          version="${TAG#v}"
          zip="bindwright-$version.zip"
          raw="Accept: application/vnd.github.raw+json"
          file=".claude-plugin/marketplace.json"
          gh api -H "$raw" "repos/$MARKETPLACE_REPO/contents/$file" > "$RUNNER_TEMP/wrights.json"
          markets=("$MARKETPLACE_REPO=$RUNNER_TEMP/wrights.json")
          python3 tools/pack_plugin.py --zip "$zip" --ref HEAD
          python3 - "$zip" "$version" "${markets[@]}" <<'EOF'
          import hashlib, json, sys
          zip_path, version = sys.argv[1:3]
          with open(zip_path, "rb") as fh:
              built = hashlib.sha256(fh.read()).hexdigest()
          problems = []
          for market in sys.argv[3:]:
              label, path = market.rsplit("=", 1)
              with open(path, encoding="utf-8") as fh:
                  entry = next((p for p in json.load(fh)["plugins"] if p["name"] == "bindwright"), None)
              if entry is None:
                  problems.append("%s does not list bindwright" % label)
                  continue
              source = entry.get("source") or {}
              if entry.get("version") != version:
                  problems.append("%s lists version %s, the tag is %s" % (label, entry.get("version"), version))
              if source.get("sha256", "").lower() != built:
                  problems.append("%s pins %s, the rebuilt zip is %s" % (label, source.get("sha256"), built))
              if not source.get("url", "").endswith("/v%s/bindwright-%s.zip" % (version, version)):
                  problems.append("%s's url does not name this release's zip" % label)
          for p in problems:
              print("::error::" + p)
          if problems:
              print("::error::fix each pin named above (python tools/pack_plugin.py --marketplace), "
                    "then run: gh workflow run release-plugin.yml -f tag=v%s" % version)
          sys.exit(1 if problems else 0)
          EOF
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Build the helper files
        if: steps.market.outputs.present == 'true'
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/helper-files"
          mkdir -p "$dir"
          if [ ! -d helper ]; then
            echo "::notice::$TAG has no helper to attach"
            exit 0
          fi
          python3 tools/pack_plugin.py --tgz "$dir" --ref HEAD
          python3 tools/pack_plugin.py --wheel "$dir" --ref HEAD
          # The zip's helper.json was computed from the same tree: refuse any file that differs from its pin.
          unzip -p "$ZIP_PATH" helper.json > "$RUNNER_TEMP/helper.json"
          python3 - "$RUNNER_TEMP/helper.json" "$dir" <<'EOF'
          import hashlib, json, os, sys
          pins, folder = json.load(open(sys.argv[1], encoding="utf-8")), sys.argv[2]
          bad = []
          for kind in ("node", "python"):
              with open(os.path.join(folder, pins[kind]["file"]), "rb") as fh:
                  if hashlib.sha256(fh.read()).hexdigest() != pins[kind]["sha256"]:
                      bad.append(pins[kind]["file"])
          for name in bad:
              print("::error::%s differs from the SHA-256 the plugin pins" % name)
          sys.exit(1 if bad else 0)
          EOF
        env:
          ZIP_PATH: ${{ steps.build.outputs.zip }}

      - name: Attach the zip and the helper files to the release
        if: steps.market.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          gh release upload "$TAG" "$ZIP" "$RUNNER_TEMP"/helper-files/* --clobber --repo "$GITHUB_REPOSITORY"

      # The plugin directory listing follows the `plugin` branch, whose root
      # is the packed plugin of the newest release: the same files as the zip,
      # one commit per release on top of the last. Each push the directory
      # finds replaces the version under its review, so while the repository
      # variable DIRECTORY_HOLD is set the branch stays where it is; the release
      # and the marketplace pin go out as usual.
      - name: Hold the plugin branch for the directory's review
        if: steps.market.outputs.present == 'true' && vars.DIRECTORY_HOLD != ''
        run: echo "::notice::DIRECTORY_HOLD is set, so the plugin branch keeps the version the directory is reviewing"

      - name: Publish the packed plugin to the plugin branch
        if: steps.market.outputs.present == 'true' && vars.DIRECTORY_HOLD == ''
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          set -euo pipefail
          zip_path="$GITHUB_WORKSPACE/$ZIP"
          dir="$RUNNER_TEMP/plugin-branch"
          url="https://github.com/$GITHUB_REPOSITORY"
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git init -q "$dir"
          cd "$dir"
          if git -c http.extraheader="$auth" ls-remote --exit-code -q "$url" refs/heads/plugin >/dev/null; then
            git -c http.extraheader="$auth" fetch -q --depth 1 "$url" plugin
            git checkout -q -b plugin FETCH_HEAD
            git rm -rq --ignore-unmatch .
          else
            git checkout -q --orphan plugin
          fi
          unzip -q "$zip_path" -d .
          git add -A
          if git diff --cached --quiet; then
            echo "::notice::The plugin branch already holds $TAG's plugin"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore(release): plugin $TAG"
          git -c http.extraheader="$auth" push -q "$url" plugin:plugin
          echo "::notice::The plugin branch now holds $TAG's plugin"
